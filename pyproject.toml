[project]
name = "voice-agent-runtime"
version = "0.1.0"
description = "Engineering runtime for voice agents: streaming STT, agent turns, TTS, latency budgets, barge-in, confidence fallbacks."
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B"]
ignore = ["E741", "B905"]
